<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athos gallery</title>
<style>
  /* Written by `athos gallery build` from athos/gallery.html: edit the template and the pages, not this file. */
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --dim: #6b6b6b; --line: #e6e3dc; --soft: #f7f6f3;
    --accent: #c15f3c; --branch: #a46d0f;
    --serif: "Iowan Old Style", Georgia, serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262624; --fg: #f0eee6; --dim: #a6a39a; --line: #3d3c38; --soft: #30302d;
      --accent: #e08a65; --branch: #e0b45e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #262624; --fg: #f0eee6; --dim: #a6a39a; --line: #3d3c38; --soft: #30302d;
    --accent: #e08a65; --branch: #e0b45e;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header .brand { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
    font-weight: 600; }
  header h1 { font: 600 28px/1.25 var(--serif); margin: 4px 0 6px; }
  header p { color: var(--dim); margin: 0 0 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .filters button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .sep { width: 1px; background: var(--line); margin: 0 4px; }
  article { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 12px; margin: 0 0 16px; }
  article h2 { font: 600 20px/1.3 var(--serif); margin: 0 0 2px; }
  .meta { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .when { margin: 6px 0 10px; }
  ol.tasks { list-style: none; margin: 0; padding: 0; }
  ol.tasks li { display: flex; gap: 10px; padding: 6px 2px; border-top: 1px solid var(--line); }
  ol.tasks li:last-child { border-bottom: 1px solid var(--line); }
  ol.tasks li.sub { padding-left: 26px; color: var(--dim); }
  .box { flex: none; width: 15px; height: 15px; margin-top: 3px; border: 1.5px solid var(--dim); border-radius: 4px; }
  .if { display: block; font-size: 12px; color: var(--branch); }
  .calls { margin: 10px 0 0; font-size: 13px; color: var(--dim); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .use { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--bg); cursor: pointer; }
  .hint { color: var(--dim); font-size: 13px; }
  code { font: 13px ui-monospace, Menlo, monospace; background: var(--soft); padding: 1px 4px; border-radius: 4px; }
  .empty { color: var(--dim); }
  footer { color: var(--dim); font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">Athos</div>
    <h1 id="title"></h1>
    <p id="lede"></p>
  </header>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
<script id="data" type="application/json">__GALLERY__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const WORDS = {
  en: {
    title: 'Ways of working to take', all: 'All', lang: { en: 'English', es: 'Español' },
    lede: 'Each one is a page of steps a professional follows, with the branches it takes when the case needs them. ' +
      'Take one into your own Athos and change it to how you work.',
    use: 'Use in Athos', copied: 'Copied. Paste it in Claude Desktop, Claude Code, Codex, Muse Code or OpenCode with ' +
      'Athos installed: it adds this page and the ones it calls.',
    copyFail: 'Copy this and paste it in your agent:', calls: 'Calls', ifw: 'If',
    foot: 'Every example is fictional and leaves the professional decisions to the person. Added pages live in ' +
      '~/.athos on your computer; nothing is sent anywhere.',
    get: 'Get Athos', contribute: 'Share yours: ask your agent to "share it with the gallery"',
    contributeUrl: 'https://github.com/athos-agent/athos/blob/main/gallery/CONTRIBUTING.md',
    prof: { law: 'Law', finance: 'Finance', journalism: 'Journalism', science: 'Science', ops: 'Operations',
            other: 'Other' },
  },
  es: {
    title: 'Formas de trabajar para llevarte', all: 'Todas', lang: { en: 'English', es: 'Español' },
    lede: 'Cada una es una página con los pasos que sigue un profesional, y las ramas que toma cuando el caso lo ' +
      'pide. Llevate una a tu Athos y cambiala a tu manera de trabajar.',
    use: 'Usar en Athos', copied: 'Copiado. Pegalo en Claude Desktop, Claude Code, Codex, Muse Code u OpenCode con ' +
      'Athos instalado: agrega esta página y las que llama.',
    copyFail: 'Copiá esto y pegalo en tu agente:', calls: 'Llama a', ifw: 'Si',
    foot: 'Todos los ejemplos son ficticios y dejan las decisiones profesionales a la persona. Las páginas que ' +
      'agregues quedan en ~/.athos en tu computadora; no se envía nada a ningún lado.',
    get: 'Instalar Athos', contribute: 'Compartí la tuya: pedile a tu agente «compartila en la galería»',
    contributeUrl: 'https://github.com/athos-agent/athos/blob/main/gallery/CONTRIBUIR.md',
    prof: { law: 'Derecho', finance: 'Finanzas', journalism: 'Periodismo', science: 'Ciencia', ops: 'Operaciones',
            other: 'Otras' },
  },
};
const byId = Object.fromEntries(DATA.entries.map(e => [e.id, e]));
let lang = (navigator.language || 'en').slice(0, 2) === 'es' ? 'es' : 'en', prof = null;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const md = t => esc(t).replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (_, p, l) => l || (byId[p] ? byId[p].title : p))
  .replace(/`([^`]+)`/g, '<code>$1</code>');
const lower = t => t ? t[0].toLowerCase() + t.slice(1) : t;

// The steps as Athos's panel draws them: a checklist, and under a step that branches, the called page's steps
// with ↳ and the condition that sends the task there.
function steps(e, W) {
  let out = '';
  for (const s of e.steps) {
    out += `<li><span class="box"></span><span>${md(s.label)}</span></li>`;
    for (const b of s.branches) {
      const q = byId[b.page];
      if (!q) continue;
      const subs = b.statement ? q.steps.slice(Math.max(0, q.steps.findIndex(x => x.id === b.statement))) : q.steps;
      subs.forEach((x, i) => {
        const cond = i === 0 ? `<span class="if">${esc(b.if ? W.ifw + ' ' + lower(b.if) : W.calls + ' «' + q.title + '»')}</span>` : '';
        out += `<li class="sub"><span class="box"></span><span>${cond}↳ ${md(x.label)}</span></li>`;
      });
    }
  }
  return out;
}

function draw() {
  const W = WORDS[lang];
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = W.title;
  document.getElementById('lede').textContent = W.lede;
  document.getElementById('foot').innerHTML = esc(W.foot) +
    ` <a href="https://github.com/athos-agent/athos">${esc(W.get)}</a> · <a href="${W.contributeUrl}">${esc(W.contribute)}</a>`;
  const shown = DATA.entries.filter(e => e.lang === lang && e.entry);
  const profs = [...new Set(DATA.entries.filter(e => e.lang === lang && e.entry).map(e => e.profession))];
  document.getElementById('filters').innerHTML =
    Object.entries(W.lang).map(([k, v]) => `<button data-lang="${k}" aria-pressed="${k === lang}">${v}</button>`).join('') +
    '<span class="sep"></span>' +
    `<button data-prof="" aria-pressed="${!prof}">${W.all}</button>` +
    profs.map(p => `<button data-prof="${p}" aria-pressed="${p === prof}">${esc(W.prof[p] || p)}</button>`).join('');
  const list = shown.filter(e => !prof || e.profession === prof);
  document.getElementById('list').innerHTML = list.map(e => `<article id="${esc(e.id)}">
      <div class="meta">${esc(W.prof[e.profession] || e.profession)}</div>
      <h2>${esc(e.title)}</h2>
      <p class="when">${md(e.when[0].toUpperCase() + e.when.slice(1))}.</p>
      <ol class="tasks">${steps(e, W)}</ol>
      ${e.calls.length ? `<p class="calls">${esc(W.calls)}: ${e.calls.map(c => '«' + esc(byId[c] ? byId[c].title : c) + '»').join(' · ')}</p>` : ''}
      <div class="row"><button class="use" data-use="${esc(e.id)}">${esc(W.use)}</button><span class="hint" data-hint="${esc(e.id)}"></span></div>
    </article>`).join('') || '<p class="empty">—</p>';
}

document.addEventListener('click', async ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; prof = null; draw(); }
  else if (b.dataset.prof !== undefined) { prof = b.dataset.prof || null; draw(); }
  else if (b.dataset.use) {
    const e = byId[b.dataset.use], W = WORDS[lang];
    const text = DATA.request[e.lang].replace('{id}', e.id);
    const hint = document.querySelector(`[data-hint="${CSS.escape(e.id)}"]`);
    try { await navigator.clipboard.writeText(text); hint.textContent = W.copied; }
    catch (err) { hint.innerHTML = `${esc(W.copyFail)} <code>${esc(text)}</code>`; }
  }
});
draw();
</script>
</body>
</html>
