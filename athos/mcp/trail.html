<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athos · trail</title>
<style>
  /* The host's own colours and font when it gives them (MCP Apps style variables), plain ones otherwise. */
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --fg: var(--color-text-primary, #1f1f1f);
    --dim: var(--color-text-secondary, #6b6b6b);
    --line: var(--color-border-primary, #e3e3e3);
    --accent: #2a8c8c; --done: #3a8a3a; --new: #b07a12;
    color-scheme: light dark;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1f1f1f);
    --fg: var(--color-text-primary, #f2f2f2);
    --dim: var(--color-text-secondary, #a0a0a0);
    --line: var(--color-border-primary, #3a3a3a);
    --accent: #5cc6c6; --done: #7ccf7c; --new: #e3b45a;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--font-sans, -apple-system, system-ui, sans-serif); }
  main { padding: 12px 14px; }
  .hello { font-size: 15px; margin-bottom: 2px; }
  .ready { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .bar { display: flex; gap: 6px; float: right; }
  .bar button { font-size: 11px; padding: 2px 8px; }
  h2 { font-size: 14px; margin: 10px 0 4px; }
  .why { color: var(--dim); font-size: 12px; font-weight: normal; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 8px; padding: 3px 0; }
  li .mark { width: 1em; flex: none; text-align: center; }
  li.done .mark { color: var(--done); }
  li.now { color: var(--accent); font-weight: 600; }
  li.now .do { font-weight: normal; color: var(--fg); display: block; }
  li.ahead { color: var(--dim); }
  li.new { color: var(--new); }
  .note { color: var(--dim); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--dim); }
  .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); flex: 1; min-width: 160px; }
  .hidden, [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <button id="pip" class="hidden"></button>
    <button id="full" class="hidden"></button>
  </div>
  <div class="hello" id="hello"></div>
  <div class="ready" id="ready"></div>
  <div id="trail"></div>
  <div class="actions" id="adjustRow" hidden>
    <input id="adjustText">
    <button id="adjustSend"></button>
  </div>
  <div class="actions">
    <button id="adjust" class="hidden"></button>
    <button id="save" class="hidden"></button>
  </div>
</main>
<script>
// Athos's trail panel for MCP Apps hosts (Claude Desktop's chat): JSON-RPC with the host over postMessage. It draws
// what the athos_* tools return (structuredContent) and asks the app-only athos_trail again while the task runs.
const WORDS = {
  en: { ready: n => `${n} way${n === 1 ? '' : 's'} of working ready`, progress: (d, n) => `${d}/${n} steps`,
        matched: 'matched', opened: 'opened by the agent', newStep: 'new', agents: 'Subagents', skills: 'Skills',
        adjust: 'Adjust step', saveNew: 'Save new steps', send: 'Send', how: 'How should this step change?',
        drafting: 'No know-how for this task yet: its steps draft a new one.',
        waiting: 'The trail of the next task shows here.', pip: 'Keep beside', full: 'Full screen' },
  es: { ready: n => `${n} forma${n === 1 ? '' : 's'} de trabajar lista${n === 1 ? '' : 's'}`,
        progress: (d, n) => `${d}/${n} pasos`, matched: 'coincidió', opened: 'abierta por el agente',
        newStep: 'nuevo', agents: 'Subagentes', skills: 'Skills', adjust: 'Ajustar paso',
        saveNew: 'Guardar pasos nuevos', send: 'Enviar', how: '¿Cómo cambia este paso?',
        drafting: 'Todavía no hay know-how para esta tarea: sus pasos arman uno nuevo.',
        waiting: 'Acá se ve la trayectoria de la próxima tarea.', pip: 'Fijar al costado', full: 'Pantalla completa' },
};
let state = null, host = {}, nextId = 1, polls = 0;
const pending = new Map();
const $ = id => document.getElementById(id);
const w = () => WORDS[state && state.lang === 'es' ? 'es' : 'en'];

function send(msg) { window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*'); }
function request(method, params) {
  const id = nextId++;
  send({ id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
function notify(method, params) { send({ method, params }); }

window.addEventListener('message', ev => {
  const m = ev.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.id !== undefined && pending.has(m.id) && !m.method) {
    const p = pending.get(m.id); pending.delete(m.id);
    m.error ? p.reject(m.error) : p.resolve(m.result);
  } else if (m.method === 'ui/notifications/tool-result') {
    take(m.params);
  } else if (m.method === 'ui/notifications/host-context-changed') {
    theme(m.params || {});
  }
});

function theme(ctx) {
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  for (const [k, v] of Object.entries((ctx.styles && ctx.styles.variables) || {}))
    if (v) document.documentElement.style.setProperty(k, v);
  if (ctx.availableDisplayModes) host.modes = ctx.availableDisplayModes;
  if (ctx.displayMode) host.mode = ctx.displayMode;
}

function take(result) {
  const s = result && (result.structuredContent ||
    (() => { try { return JSON.parse(result.content[0].text) } catch (e) { return null } })());
  if (s && s.trail) { state = s; draw(); }
}

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

function draw() {
  if (!state) return;
  const W = w(), t = state.trail;
  $('hello').textContent = state.greeting || '';
  $('ready').textContent = W.ready(state.pieces);
  let html = '';
  for (const p of t.pieces) {
    const done = p.steps.filter(x => x.state === 'done').length;
    const how = p.how === 'read' ? W.opened : p.why.length ? `${W.matched}: ${p.why.slice(0, 3).join(', ')}` : '';
    html += `<h2>«${esc(p.title)}» v${p.version} <span class="why">· ${W.progress(done, p.steps.length)}${how ? ' · ' + esc(how) : ''}</span></h2><ol>`;
    for (const x of p.steps) {
      const mark = x.state === 'done' ? '✓' : x.state === 'now' ? '▶' : '○';
      html += `<li class="${x.state}"><span class="mark">${mark}</span><span>#${esc(x.id)}` +
        (x.state === 'now' && x.do ? `<span class="do">${esc(x.do)}</span>` : '') + '</span></li>';
    }
    html += '</ol>';
  }
  if (t.new.length) {
    if (!t.pieces.length) html += `<div class="note">${esc(W.drafting)}</div>`;
    html += '<ol>' + t.new.map(n => `<li class="new"><span class="mark">+</span><span>${esc(W.newStep)}: ${esc(n)}</span></li>`).join('') + '</ol>';
  }
  const agents = t.beside.filter(b => b.kind === 'agent').map(b => b.why ? `${b.name} (${b.why})` : b.name);
  const skills = t.beside.filter(b => b.kind === 'skill').map(b => b.name);
  if (agents.length) html += `<div class="note">${esc(W.agents)}: ${esc(agents.join(' · '))}</div>`;
  if (skills.length) html += `<div class="note">${esc(W.skills)}: ${esc(skills.join(' · '))}</div>`;
  $('trail').innerHTML = html || `<div class="empty">${esc(W.waiting)}</div>`;

  const now = current();
  $('adjust').textContent = W.adjust; $('adjust').classList.toggle('hidden', !now);
  $('save').textContent = W.saveNew; $('save').classList.toggle('hidden', !t.new.length);
  $('adjustSend').textContent = W.send; $('adjustText').placeholder = W.how;
  const modes = host.modes || [];
  $('pip').textContent = W.pip; $('pip').classList.toggle('hidden', !modes.includes('pip') || host.mode === 'pip');
  $('full').textContent = W.full;
  $('full').classList.toggle('hidden', !modes.includes('fullscreen') || host.mode === 'fullscreen');
  size();
}

function current() {
  for (const p of (state && state.trail.pieces) || [])
    for (const x of p.steps) if (x.state === 'now') return { piece: p.id, step: x.id };
  return null;
}

function size() {
  notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth,
                                            height: document.documentElement.scrollHeight });
}

// The person's words go to the chat as their message; the agent then improves the piece (see the server's
// instructions). Hosts may ask the person first.
function say(text) { return request('ui/message', { role: 'user', content: { type: 'text', text } }).catch(() => {}); }

$('adjust').onclick = () => { $('adjustRow').hidden = false; $('adjustText').focus(); size(); };
$('adjustSend').onclick = () => {
  const now = current(), text = $('adjustText').value.trim();
  if (!now || !text) return;
  say(`${state.adjust_prefix} ${now.piece}#${now.step}: ${text}`);
  $('adjustText').value = ''; $('adjustRow').hidden = true; size();
};
$('adjustText').onkeydown = e => { if (e.key === 'Enter') $('adjustSend').onclick(); };
$('save').onclick = () => say(state.save_prompt);
async function mode(m) {
  try { host.mode = (await request('ui/request-display-mode', { mode: m })).mode; } catch (e) {}
  draw();
}
$('pip').onclick = () => mode('pip');
$('full').onclick = () => mode('fullscreen');

// While the panel is up the task moves (athos_step): ask again, quickly at first, then slower, and stop after an hour.
async function poll() {
  if (!host.serverTools || polls > 1800) return;
  polls++;
  try { take(await request('tools/call', { name: 'athos_trail', arguments: {} })); } catch (e) {}
  setTimeout(poll, polls < 300 ? 1500 : 5000);
}

(async () => {
  try {
    const r = await request('ui/initialize', {
      protocolVersion: '2025-06-18', appInfo: { name: 'athos-trail', version: '1' },
      appCapabilities: { availableDisplayModes: ['inline', 'pip', 'fullscreen'] },
    });
    host.serverTools = !!(r.hostCapabilities && r.hostCapabilities.serverTools);
    theme(r.hostContext || {});
  } catch (e) {}
  notify('ui/notifications/initialized', {});
  poll();
})();
new ResizeObserver(size).observe(document.body);
</script>
</body>
</html>
