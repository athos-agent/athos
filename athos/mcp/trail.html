<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athos</title>
<style>
  /* The host's own colours and fonts when it gives them (MCP Apps style variables), plain ones otherwise. */
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --fg: var(--color-text-primary, #1f1f1f);
    --dim: var(--color-text-secondary, #6b6b6b);
    --line: var(--color-border-primary, #e6e3dc);
    --soft: var(--color-background-secondary, #f7f6f3);
    --accent: #c15f3c; --done: #3f7d4a; --star: #d9a21b;
    --serif: var(--font-serif, "Iowan Old Style", Georgia, serif);
    color-scheme: light dark;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #262624);
    --fg: var(--color-text-primary, #f0eee6);
    --dim: var(--color-text-secondary, #a6a39a);
    --line: var(--color-border-primary, #3d3c38);
    --soft: var(--color-background-secondary, #30302d);
    --accent: #e08a65; --done: #86c491; --star: #f0c04a;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 var(--font-sans, -apple-system, system-ui, sans-serif); }
  main { padding: 12px 16px 10px; }

  /* The mark: Athos is here. Idle it breathes; while the task moves it pulses; when it learns, it glows. */
  .top { display: flex; align-items: center; gap: 12px; }
  .mark { position: relative; width: 34px; height: 34px; flex: none; }
  .mark .core { position: absolute; inset: 11px; border-radius: 50%; background: var(--accent);
    animation: breathe 3.2s ease-in-out infinite; }
  .mark .ring { position: absolute; inset: 3px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: .35; }
  .mark .orbit { position: absolute; inset: 0; animation: spin 2.4s linear infinite; opacity: 0; transition: opacity .4s; }
  .mark .orbit::after { content: ""; position: absolute; top: 1px; left: 15px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--accent); }
  [data-mode="active"] .mark .orbit { opacity: 1; }
  [data-mode="active"] .mark .core { animation-duration: 1.6s; }
  .mark.pulse .ring { animation: ping .9s ease-out; }
  [data-mode="learning"] .mark .core { background: var(--star); animation: glow 1s ease-in-out infinite; }
  [data-mode="learning"] .mark .orbit::after { background: var(--star); }
  [data-mode="learning"] .mark .orbit { opacity: 1; animation-duration: 1s; }
  [data-mode="done"] .mark .core { background: var(--done); animation: none; }
  [data-mode="done"] .mark .orbit { opacity: 0; animation: none; }
  [data-mode="done"] .dot.now { animation: none; transform: none; }
  .receipt { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--soft); animation: rise .35s ease-out; }
  .receipt .sum { font-size: 13px; }
  .receipt h3 { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); margin: 10px 0 4px; font-weight: 600; }
  .receipt .row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 2px 0; }
  .receipt .row .undo { margin-left: auto; }
  .chip { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    border-radius: 999px; padding: 3px 10px; margin: 2px 4px 2px 0; cursor: pointer; }
  .chip:hover, .undo:hover { border-color: var(--accent); }
  .undo { font: inherit; font-size: 12px; border: 1px solid var(--line); background: none; color: var(--dim);
    border-radius: 6px; padding: 1px 8px; cursor: pointer; }
  @keyframes breathe { 0%, 100% { transform: scale(.82); opacity: .75; } 50% { transform: scale(1); opacity: 1; } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 var(--star); } 50% { box-shadow: 0 0 10px 3px var(--star); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ping { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.5); opacity: 0; } }
  .status { flex: 1; min-width: 0; }
  .status .what { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .sub { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* The trajectory at a glance: one dot per step, the branch steps smaller. */
  .dots { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); transition: background .4s, transform .4s; }
  .dot.sub { width: 6px; height: 6px; margin-top: 1.5px; }
  .dot.done { background: var(--done); }
  .dot.now { background: var(--accent); transform: scale(1.35); animation: breathe 1.6s ease-in-out infinite; }
  .dot.skipped { background: transparent; border: 1px dashed var(--line); box-sizing: border-box; }
  .dot { cursor: pointer; border: none; padding: 0; }
  .dot.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .list { margin: 8px 0 0; font-size: 13px; }
  .list > summary { cursor: pointer; color: var(--dim); font-size: 12px; list-style: none; }
  .list > summary::before { content: "▸ "; } .list[open] > summary::before { content: "▾ "; }
  .list ol { list-style: none; margin: 4px 0 0; padding: 0; }
  .list li { display: flex; gap: 8px; padding: 3px 4px; border-radius: 6px; cursor: pointer; color: var(--dim); }
  .list li:hover { background: var(--soft); }
  .list li.now { color: var(--fg); font-weight: 600; }
  .list li.done { color: var(--fg); }
  .list li.skipped span.t { text-decoration: line-through; }
  .list li.sel { background: var(--soft); outline: 1px solid var(--line); }
  .list li .m { flex: none; width: 14px; text-align: center; }
  .list li .r { margin-left: auto; color: var(--star); flex: none; }
  .card .did { margin-top: 6px; font-size: 13px; }
  .card .back { font: inherit; font-size: 12px; background: none; border: none; padding: 0; color: var(--accent);
    cursor: pointer; text-decoration: underline; margin-top: 6px; }
  .pin { margin-left: auto; font: inherit; font-size: 12px; background: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; color: var(--dim); cursor: pointer; }

  /* The moment: what the step says, when it applies and why, as the person wrote it. */
  .card { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--soft); animation: rise .35s ease-out; }
  .card .label { font: 600 15px/1.35 var(--serif); }
  .card p { margin: 4px 0 0; font-size: 13px; }
  .card .k { color: var(--dim); }
  .card .earlier { margin-top: 6px; font-size: 12px; color: var(--dim); }
  .flash { margin: 8px 0 0; font-size: 12.5px; color: var(--accent); animation: rise .35s ease-out; }
  .flash.quiet { color: var(--dim); }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* The only control: stars, at any moment. */
  .rate { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
  .stars { display: flex; gap: 2px; }
  .stars button { font: 20px/1 sans-serif; background: none; border: none; padding: 0 2px; cursor: pointer;
    color: var(--line); transition: color .15s, transform .15s; }
  .stars button.on { color: var(--star); }
  .stars button:hover { transform: scale(1.15); }
  .stars.sent button.on { animation: pop .5s ease-out; }
  @keyframes pop { 50% { transform: scale(1.4); } }
  .rate .hint { color: var(--dim); font-size: 12px; }
  .stars b { font-weight: inherit; }
</style>
</head>
<body>
<main id="app" data-mode="idle">
  <div class="top">
    <div class="mark" id="mark"><div class="ring"></div><div class="orbit"></div><div class="core"></div></div>
    <div class="status"><div class="what" id="what"></div><div class="sub" id="sub"></div></div>
    <button class="pin" id="pin" hidden></button>
  </div>
  <div class="dots" id="dots"></div>
  <details class="list" id="list"><summary id="listsum"></summary><ol id="steps"></ol></details>
  <div id="ctx"></div>
  <div id="flash"></div>
  <div class="rate">
    <div class="stars" id="stars"></div>
    <span class="hint" id="hint"></span>
  </div>
</main>
<script>
const WORDS = {
  en: {
    idle: 'Athos is with you', idleSub: 'Rate any moment: it learns what works for you.',
    following: t => `Following «${t}»`, step: (i, n) => `step ${i} of ${n}`, done: n => `All ${n} steps done`,
    drafting: 'Noting the steps of this task', draftingSub: 'They will become your way of working.',
    when: 'When', why: 'Why', took: (c, t) => `↳ Went into «${t}»: ${c}`, called: t => `↳ Went into «${t}»`,
    skipped: t => `Skipped «${t}»: the case didn't need it`, earlier: s => `Last time here: ${s}`,
    rateHint: 'How is this going?', thanks: (n, l) => `${n}/5${l ? ` on «${l}»` : ''}: learning from this moment`,
    learnBad: 'I will avoid this next time.', learnGood: 'I will repeat what worked.', learnOk: 'Noted.',
    labels: ['Bad', 'Weak', 'OK', 'Good', 'Very good'],
    did: 'Done here', back: 'Back to the current step', rating: l => `Rating «${l}»`,
    steps: (d, n) => `Steps · ${d} of ${n} done`, pin: 'Keep beside',
    finished: t => `Done · «${t}»`, summary: (d, n) => `${d} of ${n} steps applied`, tookList: 'went into',
    skippedList: 'skipped', learned: 'Learned in this task', undo: 'Undo', undone: 'undone', newPage: 'new',
    related: 'Other ways of working that fit', use: t => `Use my way of working «${t}» for this.`,
    rateTask: 'How did the task go?',
  },
  es: {
    idle: 'Athos está con vos', idleSub: 'Calificá cualquier momento: aprende lo que te sirve.',
    following: t => `Sigo «${t}»`, step: (i, n) => `paso ${i} de ${n}`, done: n => `Listo: ${n} pasos`,
    drafting: 'Anoto los pasos de esta tarea', draftingSub: 'Van a ser tu forma de trabajar.',
    when: 'Cuándo', why: 'Por qué', took: (c, t) => `↳ Entré en «${t}»: ${c}`, called: t => `↳ Entré en «${t}»`,
    skipped: t => `Salteé «${t}»: el caso no lo pedía`, earlier: s => `La última vez acá: ${s}`,
    rateHint: '¿Cómo va?', thanks: (n, l) => `${n}/5${l ? ` en «${l}»` : ''}: aprendo de este momento`,
    learnBad: 'La próxima lo evito.', learnGood: 'Voy a repetir lo que funcionó.', learnOk: 'Anotado.',
    labels: ['Mal', 'Flojo', 'Bien', 'Muy bien', 'Excelente'],
    did: 'Lo que hice acá', back: 'Volver al paso actual', rating: l => `Calificás «${l}»`,
    steps: (d, n) => `Pasos · ${d} de ${n} hechos`, pin: 'Fijar al costado',
    finished: t => `Listo · «${t}»`, summary: (d, n) => `${d} de ${n} pasos aplicados`, tookList: 'entró en',
    skippedList: 'salteó', learned: 'Lo que aprendí en esta tarea', undo: 'Deshacer', undone: 'deshecho', newPage: 'nueva',
    related: 'Otras formas de trabajar que encajan', use: t => `Usá mi forma de trabajar «${t}» para esto.`,
    rateTask: '¿Cómo salió la tarea?',
  },
};
let state = null, prev = null, host = {}, nextId = 1, polls = 0, learning = 0, flash = null, hover = 0, sel = null;
const rated = {};                      // stars given in this panel, per step (piece#id), or 'task'
const undone = new Set();
const keyOf = (x, p) => (x.piece || p.id) + '#' + x.id;
const pending = new Map();
const $ = id => document.getElementById(id);
const w = () => WORDS[state && state.lang === 'es' ? 'es' : 'en'];
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const md = t => esc(t).replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (_, p, l) => l || p.replace(/-/g, ' '))
  .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const lower = t => t ? t[0].toLowerCase() + t.slice(1).replace(/[.\s]+$/, '') : t;
const plain = t => (t || '').replace(/^↳ /, '');

function send(msg) { window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*'); }
function request(method, params) {
  const id = nextId++;
  send({ id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
function notify(method, params) { send({ method, params }); }

window.addEventListener('message', ev => {
  const m = ev.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.id !== undefined && pending.has(m.id) && !m.method) {
    const p = pending.get(m.id); pending.delete(m.id);
    m.error ? p.reject(m.error) : p.resolve(m.result);
  } else if (m.method === 'ui/notifications/tool-result') take(m.params);
  else if (m.method === 'ui/notifications/host-context-changed') { theme(m.params || {}); draw(); }
});

function theme(ctx) {
  if (ctx.availableDisplayModes) host.modes = ctx.availableDisplayModes;
  if (ctx.displayMode) host.mode = ctx.displayMode;
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  for (const [k, v] of Object.entries((ctx.styles && ctx.styles.variables) || {}))
    if (v) document.documentElement.style.setProperty(k, v);
}

function take(result) {
  const s = (result && result._meta && result._meta['athos/panel']) || (result && result.structuredContent);
  let next = s;
  if (!next && result && result.content) {
    try { next = JSON.parse(result.content[0].text); } catch (e) { return; }
  }
  if (!next || !next.trail) return;
  prev = state; state = next;
  triggers(prev, state);
  draw();
}

// Contextual triggers: what changed since the panel last looked decides what it shows and how it moves.
function triggers(a, b) {
  if (!a || a.trail.task_id !== b.trail.task_id) { flash = null; sel = null; return; }
  const before = new Map(((a.trail.pieces[0] || {}).steps || []).map(x => [(x.piece || '') + '#' + x.id, x.state]));
  const steps = (b.trail.pieces[0] || {}).steps || [];
  for (const x of steps) {
    if (!x.via) continue;
    const was = before.get((x.piece || '') + '#' + x.id);
    if (was === 'ahead' && (x.state === 'now' || x.state === 'done'))
      flash = { text: x.if ? w().took(lower(x.if), x.via) : w().called(x.via), quiet: false, until: Date.now() + 9000 };
    else if (was === 'ahead' && x.state === 'skipped')
      flash = { text: w().skipped(x.via), quiet: true, until: Date.now() + 7000 };
  }
  if ((a.moment || {}).moved !== (b.moment || {}).moved) pulse();
}

function pulse() {
  const m = $('mark'); m.classList.remove('pulse'); void m.offsetWidth; m.classList.add('pulse');
}

function mode() {
  if (learning > Date.now()) return 'learning';
  const t = state && state.trail;
  if (state && state.ended) return 'done';
  if (!t || !t.busy) return 'idle';
  const steps = (t.pieces[0] || {}).steps || [];
  if (steps.length && steps.every(x => x.state === 'done' || x.state === 'skipped')) return 'done';
  return 'active';
}

function draw() {
  const W = w(), t = state ? state.trail : null, m = (state && state.moment) || {};
  $('app').dataset.mode = mode();
  const p = t && t.pieces[0];
  const steps = (p && p.steps) || [];
  let what = W.idle, sub = W.idleSub;
  if (p) {
    const i = steps.findIndex(x => x.state === 'now'), n = steps.length;
    what = W.following(p.title);
    sub = i >= 0 ? `${W.step(i + 1, n)} · ${plain(steps[i].label)}`
      : steps.every(x => x.state === 'done' || x.state === 'skipped') && n ? W.done(steps.filter(x => x.state === 'done').length)
      : (state.greeting || '');
  } else if (t && t.new.length) { what = W.drafting; sub = t.new[t.new.length - 1]; }
  if (state && state.ended) { what = W.finished(p ? p.title : ''); sub = state.ended.outcome || sub; }
  $('what').textContent = what; $('sub').textContent = sub;

  const now = steps.find(x => x.state === 'now');
  if (sel && !steps.some(x => keyOf(x, p) === sel)) sel = null;
  const cur = (sel && steps.find(x => keyOf(x, p) === sel)) || now;
  const curKey = cur ? keyOf(cur, p) : '';
  const isSel = k => sel && k === sel;
  $('dots').innerHTML = steps.map(x => `<button class="dot ${x.state}${x.depth ? ' sub' : ''}${isSel(keyOf(x, p)) ? ' sel' : ''}" data-k="${esc(keyOf(x, p))}" title="${esc(plain(x.label))}"></button>`).join('');
  // Every step, to open one later and rate it: what it says and what was done there.
  const mk = { done: '✓', now: '▸', skipped: '–', ahead: '○' };
  $('list').hidden = !steps.length;
  $('listsum').textContent = W.steps(steps.filter(x => x.state === 'done').length, steps.length);
  $('steps').innerHTML = steps.map(x => { const k = keyOf(x, p); return `<li class="${x.state}${isSel(k) ? ' sel' : ''}" data-k="${esc(k)}" style="${x.depth ? `padding-left:${4 + x.depth * 14}px` : ''}">` +
    `<span class="m">${mk[x.state] || ''}</span><span class="t">${md(plain(x.label))}</span>` +
    (rated[k] ? `<span class="r">${'★'.repeat(rated[k])}</span>` : '') + '</li>'; }).join('');
  let card = '';
  if (cur) {
    const earlier = (m.earlier || [])[0];
    // The step's title is the start of what to do: when it is, the card says what to do once, in full.
    // A short title (the step's action), then what to do in full only when it says more than the title.
    const title = plain(cur.label);
    const whole = !cur.do || cur.do.replace(/[.\s]+$/, '').toLowerCase() === title.replace(/…$/, '').toLowerCase();
    // Inside a branch, the card says which page it is in and the condition that led there.
    const at = steps.indexOf(cur);
    const head0 = cur.depth ? steps.slice(0, at + 1).reverse().find(x => x.via && x.depth === cur.depth) : null;
    const branch = head0 ? `<div class="k" style="font-size:12px">${esc(head0.if ? W.took(lower(head0.if), head0.via) : W.called(head0.via))}</div>` : '';
    card = `<div class="card">${branch}<div class="label">${md(title)}</div>` +
      (cur.when ? `<p><span class="k">${esc(W.when)}:</span> ${md(lower(cur.when))}</p>` : '') +
      (!whole ? `<p>${md(cur.do[0].toUpperCase() + cur.do.slice(1))}</p>` : '') +
      (cur.because ? `<p><span class="k">${esc(W.why)}:</span> ${md(cur.because)}</p>` : '') +
      (cur.did ? `<p class="did"><span class="k">${esc(W.did)}:</span> ${md(cur.did)}</p>` : '') +
      (earlier && !sel ? `<div class="earlier">${esc(W.earlier('★'.repeat(earlier.stars) + '☆'.repeat(5 - earlier.stars)))}</div>` : '') +
      (sel && cur !== now ? `<button class="back" data-back="1">${esc(W.back)}</button>` : '') +
      '</div>';
  }
  // The receipt: once the task is closed, what it did, what it learned (with undo) and what else fits.
  if (state && state.ended && !sel) {
    const took = steps.filter(x => x.via && x.state !== 'skipped' && x.state !== 'ahead').map(x => `«${x.via}»`);
    const skip = steps.filter(x => x.via && x.state === 'skipped').map(x => `«${x.via}»`);
    const done = steps.filter(x => x.state === 'done').length;
    card = `<div class="receipt"><div class="sum">${esc(W.summary(done, steps.length))}` +
      (took.length ? ` · ${esc(W.tookList)} ${esc(took.join(', '))}` : '') +
      (skip.length ? ` · ${esc(W.skippedList)} ${esc(skip.join(', '))}` : '') + '</div>' +
      ((state.learned || []).length ? `<h3>${esc(W.learned)}</h3>` + state.learned.map(l => {
        const k = l.id + '@' + l.version;
        return `<div class="row"><span>${esc(l.title)} · ${l.before ? 'v' + l.version : esc(W.newPage)}` +
          (l.note ? `<span class="k"> — ${esc(l.note)}</span>` : '') + '</span>' +
          (l.before && !undone.has(k) ? `<button class="undo" data-undo="${esc(l.id)}" data-v="${l.before}" data-key="${esc(k)}">${esc(W.undo)}</button>`
            : undone.has(k) ? `<span class="k undo-done">${esc(W.undone)}</span>` : '') + '</div>'; }).join('') : '') +
      ((state.related || []).length ? `<h3>${esc(W.related)}</h3>` + state.related.map(r =>
        `<button class="chip" data-use="${esc(r.title)}">${esc(r.title)}</button>`).join('') : '') + '</div>';
  }
  // Redrawn only when the moment changes, so the card rises once per step instead of on every poll.
  if ($('ctx').dataset.card !== card) { $('ctx').dataset.card = card; $('ctx').innerHTML = card; }

  $('flash').innerHTML = flash && flash.until > Date.now() ? `<div class="flash${flash.quiet ? ' quiet' : ''}">${esc(flash.text)}</div>` : '';

  const whole = state && state.ended && !sel;
  const shown = hover || rated[whole ? 'task' : curKey] || 0;
  $('stars').innerHTML = [1, 2, 3, 4, 5].map(n =>
    `<button data-n="${n}" class="${n <= shown ? 'on' : ''}" title="${esc(W.labels[n - 1])}" aria-label="${n}/5 ${esc(W.labels[n - 1])}">★</button>`).join('');
  if (!$('hint').dataset.locked)
    $('hint').textContent = hover ? W.labels[hover - 1] : whole ? W.rateTask
      : sel && cur ? W.rating(plain(cur.label).slice(0, 40)) : W.rateHint;
  const pin = $('pin');
  pin.hidden = !(host.modes || []).includes('pip') || host.mode === 'pip';
  pin.textContent = W.pin;
  size();
}

// The only thing the panel asks: stars, whenever the person wants. The moment and its context go with them; the
// learning is left to the model, told once in its next Athos result (and in its context where the host allows it).
async function rate(n) {
  const p = state && state.trail.pieces[0], steps = (p && p.steps) || [];
  const cur = (sel && steps.find(x => keyOf(x, p) === sel)) || steps.find(x => x.state === 'now');
  const args = { stars: n };
  if (state && state.ended && !sel && p) { args.piece = p.id; rated.task = n; }
  else if (cur) { args.piece = cur.piece || p.id; args.step = cur.id; rated[keyOf(cur, p)] = n; }
  hover = 0; learning = Date.now() + 2600; draw();
  $('stars').classList.add('sent');
  try {
    const r = await request('tools/call', { name: 'athos_rate', arguments: args });
    let out = {};
    try { out = JSON.parse(r.content[0].text); } catch (e) {}
    const W = w();
    $('hint').dataset.locked = '1';
    const short = out.label && out.label.length > 38 ? out.label.slice(0, out.label.lastIndexOf(' ', 36)) + '…' : out.label;
    $('hint').textContent = `${W.thanks(n, short)}. ${n <= 2 ? W.learnBad : n >= 4 ? W.learnGood : W.learnOk}`;
    setTimeout(() => { delete $('hint').dataset.locked; $('stars').classList.remove('sent'); draw(); }, 6000);
    if (host.modelContext && out.model_context)
      request('ui/update-model-context', { content: [{ type: 'text', text: out.model_context }] }).catch(() => {});
  } catch (e) {}
  setTimeout(draw, 2700);
}

document.addEventListener('click', e => {
  const b = e.target.closest('.stars button');
  if (b) return rate(+b.dataset.n);
  const s = e.target.closest('[data-k]');
  if (s) { sel = s.dataset.k === sel ? null : s.dataset.k; draw(); return; }
  if (e.target.closest('[data-back]')) { sel = null; draw(); return; }
  const u = e.target.closest('[data-undo]');
  if (u) {
    request('tools/call', { name: 'athos_library_do', arguments: { action: 'revert', id: u.dataset.undo, version: +u.dataset.v } })
      .then(() => { undone.add(u.dataset.key); $('ctx').dataset.card = ''; draw(); }).catch(() => {});
    return;
  }
  // Another way of working, chosen by the person: it goes to the chat as their own message, in plain sight.
  const c = e.target.closest('[data-use]');
  if (c) { request('ui/message', { role: 'user', content: { type: 'text', text: w().use(c.dataset.use) } }).catch(() => {}); return; }
  if (e.target.closest('#pin')) request('ui/request-display-mode', { mode: 'pip' })
    .then(r => { host.mode = r.mode; draw(); }).catch(() => {});
});
document.addEventListener('mouseover', e => {
  const b = e.target.closest('.stars button');
  const n = b ? +b.dataset.n : 0;
  if (n !== hover) { hover = n; draw(); }
});

function size() {
  notify('ui/notifications/size-changed', { width: document.documentElement.scrollWidth,
                                            height: document.documentElement.scrollHeight });
}

// While the panel is up the task moves (athos_step): ask again, quickly at first, then slower, and stop after an hour.
async function poll() {
  if (!host.serverTools || polls > 1800) return;
  polls++;
  try { take(await request('tools/call', { name: 'athos_trail', arguments: {} })); } catch (e) {}
  if (flash && flash.until <= Date.now()) { flash = null; draw(); }
  setTimeout(poll, polls < 300 ? 1500 : 5000);
}

(async () => {
  try {
    const r = await request('ui/initialize', {
      protocolVersion: '2025-06-18', appInfo: { name: 'athos', version: '3' },
      appCapabilities: { availableDisplayModes: ['inline', 'pip'] },
    });
    const caps = r.hostCapabilities || {};
    host.serverTools = !!caps.serverTools;
    host.modelContext = !!caps.updateModelContext;
    theme(r.hostContext || {});
  } catch (e) {}
  notify('ui/notifications/initialized', {});
  draw();
  poll();
})();
new ResizeObserver(size).observe(document.body);
</script>
</body>
</html>
