<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="athos-token" content="__ATHOS_TOKEN__">
<title>Athos · library</title>
<style>
  /* The same look as the trail panel (athos/mcp/trail.html): the host's colours when it gives them, plain ones
     otherwise; dark from the host's theme, or from the system when the page runs on its own. */
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --fg: var(--color-text-primary, #1f1f1f);
    --dim: var(--color-text-secondary, #6b6b6b);
    --line: var(--color-border-primary, #e6e3dc);
    --soft: var(--color-background-secondary, #f7f6f3);
    --accent: #c15f3c; --done: #3f7d4a; --warn: #a46d0f; --bad: #b3403a;
    --serif: var(--font-serif, "Iowan Old Style", Georgia, serif);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #262624); --fg: var(--color-text-primary, #f0eee6);
      --dim: var(--color-text-secondary, #a6a39a); --line: var(--color-border-primary, #3d3c38);
      --soft: var(--color-background-secondary, #30302d);
      --accent: #e08a65; --done: #86c491; --warn: #e0b45e; --bad: #e57b72;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #262624); --fg: var(--color-text-primary, #f0eee6);
    --dim: var(--color-text-secondary, #a6a39a); --line: var(--color-border-primary, #3d3c38);
    --soft: var(--color-background-secondary, #30302d);
    --accent: #e08a65; --done: #86c491; --warn: #e0b45e; --bad: #e57b72;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 var(--font-sans, -apple-system, system-ui, sans-serif); }
  main { padding: 14px 16px 16px; max-width: 820px; margin: 0 auto; box-sizing: border-box; }
  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .brand { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; flex: 1; }
  h1 { font: 600 20px/1.3 var(--serif); margin: 6px 0 2px; }
  h2 { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); margin: 18px 0 6px;
    font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; }
  .lede { margin: 4px 0 8px; }
  input[type=search] { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; width: 100%;
    box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); color: var(--fg); margin: 10px 0 4px; }
  button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  .link { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit;
    font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list > li { border-top: 1px solid var(--line); }
  ul.list > li:last-child { border-bottom: 1px solid var(--line); }
  .item { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 9px 2px; }
  .item:hover { background: var(--soft); }
  .item .t { font-weight: 600; }
  .item .w { color: var(--dim); font-size: 13px; }
  .item .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
  li.sub .item { padding-left: 22px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--soft);
    color: var(--dim); margin-right: 4px; }
  .ok { color: var(--done); } .fix { color: var(--warn); } .bad { color: var(--bad); }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .bar .name { font-size: 13px; font-weight: 600; }
  .bar .track { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--done); }
  .bar .words { font-size: 12px; color: var(--dim); }
  ol.tasks { list-style: none; margin: 0; padding: 0; }
  ol.tasks > li { border-top: 1px solid var(--line); }
  ol.tasks > li:last-child { border-bottom: 1px solid var(--line); }
  ol.tasks summary { display: flex; gap: 10px; padding: 7px 2px; align-items: flex-start; cursor: pointer; list-style: none; }
  ol.tasks summary::-webkit-details-marker { display: none; }
  li.depth1 summary { padding-left: 24px; }
  .box { flex: none; width: 16px; height: 16px; margin-top: 2px; border: 1.5px solid var(--dim); border-radius: 4px; }
  .cond { display: block; font-size: 12px; color: var(--accent); }
  .body { padding: 0 2px 10px 28px; }
  li.depth1 .body { padding-left: 52px; }
  .body p { margin: 0 0 6px; }
  .because { color: var(--dim); font-size: 13px; }
  code { font: 12.5px/1.4 var(--font-mono, ui-monospace, Menlo, monospace); background: var(--soft);
    padding: 1px 4px; border-radius: 4px; }
  ul.hist { list-style: none; margin: 0; padding: 0; }
  ul.hist li { border-top: 1px solid var(--line); padding: 7px 2px; }
  ul.hist .v { font-weight: 600; margin-right: 6px; }
  .confirm { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--soft); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .foot { margin-top: 16px; color: var(--dim); font-size: 11px; }
  .empty { color: var(--dim); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fg);
    color: var(--bg); padding: 7px 12px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: calc(100% - 32px); }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<main id="page"><p class="empty">…</p></main>
<div id="toast"></div>
<script>
// Athos's library: every way of working the person has. Two ways to run: on its own, served by `athos library` on
// 127.0.0.1 (data from /api/library, actions POSTed with this run's token), or as an MCP App in Claude Desktop's
// chat (data from the athos_library tool, actions through the app-only athos_library_do).
const WORDS = {
  en: {
    title: 'Your library', count: n => `${n} way${n === 1 ? '' : 's'} of working`, filter: 'Filter by words…',
    gave: 'What it gave you', list: 'Ways of working', none: 'No ways of working yet.', noMatch: 'Nothing matches.',
    used: n => n ? `used ${n} time${n === 1 ? '' : 's'}` : 'not used yet',
    good: n => `${n} good`, fixed: n => `${n} corrected`, bad: n => `${n} failed`,
    unmarked: 'none marked yet', inAgents: 'in', on: 'on', last: (v, n) => `v${v}: ${n}`,
    reached: (ts) => `reached through ${ts}`, viaIf: c => ` when ${c}`,
    back: '← All ways of working', for: 'For', version: v => `version ${v}`, steps: 'Steps', why: 'Why', when: 'When',
    history: 'Versions', current: 'current', goBack: 'Go back to this version', openEd: 'Open in editor',
    sure: (v, n) => `Go back to v${v}? It comes back as v${n}; every version stays in the history, nothing is deleted.`,
    yes: 'Yes, go back', cancel: 'Cancel', done: (v, n) => `v${v} is back, as v${n}.`, opened: 'Opened in your editor.',
    failed: 'That did not work: ', ifc: 'If',
    bar: g => {
      const out = [`${g.tasks} task${g.tasks === 1 ? '' : 's'}`];
      if (g.with_know_how) out[0] += `, ${g.with_know_how} with your know-how`;
      out.push(g.marked ? `${g.ok} of ${g.marked} you marked went well` : 'none marked yet');
      const each = [g.mean_duration_s != null && `${secs(g.mean_duration_s)}`,
                    g.mean_tokens != null && `${k(g.mean_tokens)} tokens`].filter(Boolean);
      if (each.length) out.push(`about ${each.join(' and ')} each`);
      return out.join('; ') + '.';
    },
    noTasks: 'No tasks recorded yet: once you work with an agent, each one shows here.',
    foot: h => `Your know-how, in ${h} on this computer. Nothing leaves it.`,
  },
  es: {
    title: 'Tu biblioteca', count: n => `${n} forma${n === 1 ? '' : 's'} de trabajar`, filter: 'Filtrar por palabras…',
    gave: 'Qué te aportó', list: 'Formas de trabajar', none: 'Todavía no hay formas de trabajar.', noMatch: 'Nada coincide.',
    used: n => n ? `usada ${n} ${n === 1 ? 'vez' : 'veces'}` : 'sin usar todavía',
    good: n => `${n} bien`, fixed: n => `${n} corregida${n === 1 ? '' : 's'}`, bad: n => `${n} ${n === 1 ? 'falló' : 'fallaron'}`,
    unmarked: 'ninguna marcada todavía', inAgents: 'en', on: 'con', last: (v, n) => `v${v}: ${n}`,
    reached: (ts) => `se llega desde ${ts}`, viaIf: c => ` cuando ${c}`,
    back: '← Todas las formas de trabajar', for: 'Para', version: v => `versión ${v}`, steps: 'Pasos', why: 'Por qué',
    when: 'Cuándo', history: 'Versiones', current: 'actual', goBack: 'Volver a esta versión', openEd: 'Abrir en el editor',
    sure: (v, n) => `¿Volver a la v${v}? Vuelve como v${n}; todas las versiones quedan en el historial, no se borra nada.`,
    yes: 'Sí, volver', cancel: 'Cancelar', done: (v, n) => `Volvió la v${v}, como v${n}.`, opened: 'Abierta en tu editor.',
    failed: 'No funcionó: ', ifc: 'Si',
    bar: g => {
      const out = [`${g.tasks} tarea${g.tasks === 1 ? '' : 's'}`];
      if (g.with_know_how) out[0] += `, ${g.with_know_how} con tu know-how`;
      out.push(g.marked ? `${g.ok} de ${g.marked} que marcaste salieron bien` : 'ninguna marcada todavía');
      const each = [g.mean_duration_s != null && `${secs(g.mean_duration_s)}`,
                    g.mean_tokens != null && `${k(g.mean_tokens)} tokens`].filter(Boolean);
      if (each.length) out.push(`cerca de ${each.join(' y ')} cada una`);
      return out.join('; ') + '.';
    },
    noTasks: 'Todavía no hay tareas: cuando trabajes con un agente, cada uno aparece acá.',
    foot: h => `Tu know-how, en ${h} en esta computadora. No sale de acá.`,
  },
};
const embedded = window.parent !== window;           // inside Claude Desktop's chat (MCP App)
const TOKEN = document.querySelector('meta[name=athos-token]').content;
let snap = null, current = null, confirming = null, filter = '', nextId = 1;
const pending = new Map();
const $ = id => document.getElementById(id);
const W = () => WORDS[snap && snap.lang === 'es' ? 'es' : 'en'];
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function md(t) {
  return esc(t)
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (_, p, l) => l || p.replace(/-/g, ' '))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
const lower = t => t ? t[0].toLowerCase() + t.slice(1).replace(/[.\s]+$/, '') : t;
const cut = (t, n) => !t || t.length <= n ? t : t.slice(0, t.lastIndexOf(' ', n)).replace(/[,;:(\s]+$/, '') + '…';
const k = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : Math.round(n) + '';
const secs = s => s >= 90 ? Math.round(s / 60) + ' min' : Math.round(s) + ' s';
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 3000); }

// ---------------------------------------------------------------------------------------------- transport
function send(msg) { window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*'); }
function request(method, params) {
  const id = nextId++; send({ id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
window.addEventListener('message', ev => {
  const m = ev.data;
  if (!embedded || !m || m.jsonrpc !== '2.0') return;
  if (m.id !== undefined && pending.has(m.id) && !m.method) {
    const p = pending.get(m.id); pending.delete(m.id); m.error ? p.reject(m.error) : p.resolve(m.result);
  } else if (m.method === 'ui/notifications/tool-result') take(m.params);
  else if (m.method === 'ui/notifications/host-context-changed') { theme(m.params || {}); draw(); }
});
function theme(ctx) {
  if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  for (const [key, v] of Object.entries((ctx.styles && ctx.styles.variables) || {}))
    if (v) document.documentElement.style.setProperty(key, v);
}
function take(result) {
  const s = result && ((result._meta && result._meta['athos/library']) || result.structuredContent);
  if (s && s.pieces) { snap = s; draw(); }
}
async function load() {
  if (embedded) return take(await request('tools/call', { name: 'athos_library', arguments: {} }));
  snap = await (await fetch('/api/library', { cache: 'no-store' })).json();
  draw();
}
async function act(action, args) {
  if (embedded) {
    const r = await request('tools/call', { name: 'athos_library_do', arguments: { action, ...args } });
    if (r.isError) throw new Error((r.content && r.content[0] && r.content[0].text) || 'error');
    return JSON.parse(r.content[0].text);
  }
  const r = await fetch('/api/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json',
    'X-Athos-Token': TOKEN }, body: JSON.stringify(args) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ---------------------------------------------------------------------------------------------- drawing
function went(p, w) {
  const marks = [[p.ok, 'ok', w.good], [p.corrected, 'fix', w.fixed], [p.failed, 'bad', w.bad]]
    .filter(m => m[0]).map(([n, cls, f]) => `<span class="${cls}">${esc(f(n))}</span>`).join(', ');
  return marks || (p.uses ? esc(w.unmarked) : '');
}
function line(p, w) {
  const bits = [esc(w.used(p.uses))];
  const g = went(p, w); if (g) bits.push(g);
  if (p.agents.length) bits.push(`${esc(w.inAgents)} ${esc(p.agents.join(', '))}`);
  if (p.models.length) bits.push(`${esc(w.on)} ${esc(p.models.join(', '))}`);
  return bits.join(' · ');
}
function reachedText(p, w) {
  return w.reached(p.reached_from.map(r => `«${esc(r.title)}»` + (r.if ? esc(w.viaIf(lower(r.if))) : '')).join(', '));
}
function item(p, w, sub) {
  const lc = p.last_change;
  return `<li class="${sub ? 'sub' : ''}"><button class="item" data-open="${esc(p.id)}">
    <div class="t">${sub ? '↳ ' : ''}${esc(p.title)}</div>
    <div class="w">${md(cut(p.when, 160))}</div>
    ${p.reached_from.length ? `<div class="s">${reachedText(p, w)}</div>` : ''}
    <div class="s">${line(p, w)}</div>
    ${lc ? `<div class="s">${md(w.last(lc.version, cut(lc.note, 120)))}${lc.date ? ' · ' + esc(lc.date) : ''}</div>` : ''}
  </button></li>`;
}
function listView(w) {
  const q = filter.trim().toLowerCase();
  const hit = p => !q || [p.title, p.when, p.id, ...p.agents, ...p.models].join(' ').toLowerCase().includes(q);
  let rows = '';
  if (q) rows = snap.pieces.filter(hit).map(p => item(p, w, p.reached_from.length > 0)).join('');
  else {
    // Pages reached only through another page's Calls/If sit under it, once, like the steps in the panel.
    const byId = Object.fromEntries(snap.pieces.map(p => [p.id, p])), shown = new Set();
    const under = {};
    for (const p of snap.pieces) if (p.reached_from.length) {
      const host = p.reached_from.find(r => byId[r.id]);
      if (host) (under[host.id] = under[host.id] || []).push(p);
    }
    const put = (p, depth) => {
      if (shown.has(p.id)) return ''; shown.add(p.id);
      return item(p, w, depth > 0) + (under[p.id] || []).map(c => put(c, depth + 1)).join('');
    };
    for (const p of snap.pieces) if (!p.reached_from.some(r => byId[r.id])) rows += put(p, 0);
    for (const p of snap.pieces) rows += put(p, 1);       // a loop of pages: still listed
  }
  const bars = snap.gave.length ? `<div class="bars">${snap.gave.map(g => `<div class="bar">
      <div class="name">${esc(g.agent)} <span class="meta">· ${esc(g.model)}</span></div>
      <div class="track"><div class="fill" style="width:${Math.round((g.success_rate || 0) * 100)}%"></div></div>
      <div class="words">${esc(w.bar(g))}</div></div>`).join('')}</div>` : `<p class="empty">${esc(w.noTasks)}</p>`;
  return `<div class="top"><span class="brand">Athos</span><span class="sub">${esc(w.count(snap.pieces.length))}</span></div>
    <h1>${esc(w.title)}</h1>
    <h2>${esc(w.gave)}</h2>${bars}
    <h2>${esc(w.list)}</h2>
    <input type="search" id="filter" placeholder="${esc(w.filter)}" value="${esc(filter)}">
    ${snap.pieces.length ? (rows ? `<ul class="list">${rows}</ul>` : `<p class="empty">${esc(w.noMatch)}</p>`)
                         : `<p class="empty">${esc(w.none)}</p>`}`;
}
function step(x, w) {
  return `<li class="depth${x.depth}"><details><summary><span class="box"></span><span>
    ${x.if ? `<span class="cond">${esc(w.ifc)} ${md(lower(x.if))}</span>` : ''}${x.depth ? '↳ ' : ''}${md(x.label)}</span></summary>
    <div class="body">${x.when ? `<p class="because"><b>${esc(w.when)}:</b> ${md(lower(x.when))}</p>` : ''}${x.do && x.do !== x.label ? `<p>${md(x.do)}</p>` : ''}${x.because ? `<p class="because"><b>${esc(w.why)}:</b> ${md(x.because)}</p>` : ''}</div></details></li>`;
}
function pieceView(p, w) {
  const hist = p.history.map(h => `<li><span class="v">v${h.version}</span><span class="meta">${esc(h.date)}${h.by ? ' · ' + esc(h.by) : ''}${h.current ? ' · ' + esc(w.current) : ''}</span>
      <div>${md(h.note)}</div>
      ${confirming === h.version
        ? `<div class="confirm">${esc(w.sure(h.version, p.version + 1))}<div class="row">
             <button class="primary" data-yes="${h.version}">${esc(w.yes)}</button><button data-cancel="1">${esc(w.cancel)}</button></div></div>`
        : h.can_go_back ? `<div class="row"><button data-back="${h.version}">${esc(w.goBack)}</button></div>` : ''}</li>`).join('');
  return `<div class="top"><button class="link" data-home="1">${esc(w.back)}</button></div>
    <h1>${esc(p.title)}</h1>
    <div class="meta">${esc(w.version(p.version))} · ${line(p, w)}</div>
    ${p.reached_from.length ? `<div class="meta">${reachedText(p, w)}</div>` : ''}
    <p class="lede"><b>${esc(w.for)}:</b> ${md(lower(p.when))}</p>
    <div class="row"><button data-edit="${esc(p.id)}">${esc(w.openEd)}</button></div>
    <h2>${esc(w.steps)}</h2><ol class="tasks">${p.steps.map(x => step(x, w)).join('')}</ol>
    <h2>${esc(w.history)}</h2><ul class="hist">${hist}</ul>`;
}
function draw() {
  if (!snap) return;
  const w = W(), p = current && snap.pieces.find(x => x.id === current);
  document.documentElement.lang = snap.lang;
  const focus = document.activeElement && document.activeElement.id === 'filter';
  $('page').innerHTML = (p ? pieceView(p, w) : listView(w)) + `<div class="foot">${esc(w.foot(snap.home))}</div>`;
  const f = $('filter');
  if (f) { f.oninput = () => { filter = f.value; draw(); }; if (focus) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  size();
}
function go(id) {
  current = id; confirming = null;
  if (!embedded) history.replaceState(null, '', id ? '#' + encodeURIComponent(id) : location.pathname);
  draw(); window.scrollTo(0, 0);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const w = W();
  if (b.dataset.open) go(b.dataset.open);
  else if (b.dataset.home) go(null);
  else if (b.dataset.back) { confirming = +b.dataset.back; draw(); }
  else if (b.dataset.cancel) { confirming = null; draw(); }
  else if (b.dataset.yes) {
    const v = +b.dataset.yes; confirming = null;
    try { const r = await act('revert', { id: current, version: v }); toast(w.done(v, r.version)); await load(); }
    catch (err) { toast(w.failed + (err.message || err)); draw(); }
  } else if (b.dataset.edit) {
    try { await act('open', { id: b.dataset.edit }); toast(w.opened); } catch (err) { toast(w.failed + (err.message || err)); }
  }
});
window.addEventListener('hashchange', () => { if (!embedded) { current = decodeURIComponent(location.hash.slice(1)) || null; draw(); } });

function size() {
  if (embedded) send({ method: 'ui/notifications/size-changed', params: {
    width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight } });
}

(async () => {
  if (embedded) {
    try {
      const r = await request('ui/initialize', { protocolVersion: '2025-06-18', appInfo: { name: 'athos-library', version: '1' },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] } });
      theme(r.hostContext || {});
    } catch (e) {}
    send({ method: 'ui/notifications/initialized', params: {} });
    new ResizeObserver(size).observe(document.body);
  } else current = decodeURIComponent(location.hash.slice(1)) || null;
  try { await load(); } catch (e) {}
})();
</script>
</body>
</html>
